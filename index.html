<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <nav>
        <a href="#">Logo</a>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero">
        <h1>市川</h1>
        <p>肩書き</p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>自己紹介</p>
      </section>

      <section id="projects">
        <h2>Projects</h2>
        <article>
          <h3>プロジェクト名</h3>
          <p>説明</p>
          <a>リンク</a>
        </article>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <form action="https://formspree.io/f/mredygeg" method="POST">
          <input
            type="hidden"
            name="_subject"
            value="ポートフォリオお問い合わせ"
          />
          <label>
            メールアドレス
            <input
              class="email-input"
              type="email"
              name="メールアドレス"
              autocomplete="off"
            />
          </label>
          <label>
            お問い合わせ内容
            <textarea
              name="お問い合わせ内容"
              class="message-input"
              autocomplete="off"
            ></textarea>
          </label>
          <button type="submit">送信</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 名前</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
